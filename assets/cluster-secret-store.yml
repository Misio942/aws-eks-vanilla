apiVersion: externalsecrets.kubernetes-client.io/v1
kind: ClusterSecretStore
metadata:
  name: sandbox-secret-store
  namespace: external-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-kubernetes-external-secrets
            namespace: external-secrets
